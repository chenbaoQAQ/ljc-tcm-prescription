<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>药方管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-back"><i class="fas fa-chevron-left"></i></a>
        <h1 class="nav-title">药方管理</h1>
        <div class="nav-back"></div>
    </div>

    <div class="container">
        <!-- New Prescription Button -->
        <div class="mb-20">
            <a href="prescription-edit.html" class="btn btn-primary">+ 新建药方</a>
        </div>

        <!-- Prescription List -->
        <h3 class="title">药方列表</h3>
        <div id="prescriptionList" class="card">
            <!-- Items injected by JS -->
            <div class="empty-state">加载中...</div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadPrescriptions);

        async function loadPrescriptions() {
            const listEl = document.getElementById('prescriptionList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';

            try {
                const data = await api.getPrescriptions({
                    page: 1,
                    size: 100
                });

                const list = data.content || [];

                if (list.length === 0) {
                    listEl.innerHTML = '<div class="empty-state">暂无药方，点击"新建药方"</div>';
                    return;
                }

                listEl.innerHTML = list.map(item => `
                    <div class="list-item">
                        <div class="list-content">
                            <h4 class="list-title">${item.name}</h4>
                            <p class="list-subtitle">${item.itemCount} 味药材</p>
                        </div>
                        <div class="list-actions">
                            <a href="prescription-edit.html?id=${item.id}" class="btn btn-sm" style="background:#e6f7ff; color:#1890ff;">编辑</a>
                            <button class="btn btn-sm btn-danger" onclick="deletePrescription(${item.id}, '${item.name}')">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }

        function deletePrescription(id, name) {
            if (confirm(`确定要删除药方"${name}"吗？这将不会影响已生成的病历历史。`)) {
                api.deletePrescription(id).then(() => {
                    showToast('已删除');
                    loadPrescriptions();
                });
            }
        }
    </script>
</body>

</html>
