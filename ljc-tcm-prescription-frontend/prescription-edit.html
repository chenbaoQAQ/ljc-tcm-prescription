<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>编辑药方</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <a href="prescription.html" class="nav-back"><i class="fas fa-chevron-left"></i></a>
        <h1 class="nav-title">编辑药方</h1>
        <div class="nav-back"></div>
    </div>

    <div class="container">
        <!-- Name -->
        <div class="card form-item">
            <h3 class="form-label">药方名称</h3>
            <input type="text" id="name" class="form-input" placeholder="输入药方名称" />
        </div>

        <!-- Items -->
        <h3 class="title">药材明细</h3>
        <div class="card form-item">
            <button class="btn btn-sm btn-primary mb-20" onclick="addItem()">+ 添加药材</button>
            <div id="itemList">
                <!-- Items injected here -->
            </div>
            <div class="empty-state" id="emptyState">点击"+ 添加药材"</div>
        </div>

        <!-- Buttons -->
        <button class="btn btn-primary" onclick="savePrescription()">保存药方</button>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', init);

        let herbs = [];
        let items = [];
        let id = null;

        async function init() {
            // Check if Edit Mode FIRST to update UI immediately
            const urlParams = new URLSearchParams(window.location.search);
            id = urlParams.get('id');

            if (id) {
                console.log('Edit mode, ID:', id);
                document.title = '编辑药方';
                document.querySelector('.nav-title').textContent = '编辑药方';
            } else {
                console.log('Create mode');
                document.title = '新建药方';
                document.querySelector('.nav-title').textContent = '新建药方';
            }

            // Load Herbs
            try {
                const res = await api.getHerbs({ page: 1, size: 200 });
                herbs = res.content || [];
                console.log('Herbs loaded:', herbs.length);
            } catch (err) {
                console.error('Failed to load herbs:', err);
                showToast('无法加载药材库', 'error');
            }

            // Load Prescription Data if Edit Mode
            if (id) {
                loadPrescription(id);
            }
        }

        async function loadPrescription(id) {
            try {
                console.log('Loading prescription:', id);
                const data = await api.getPrescription(id);
                console.log('Prescription data:', data);

                if (data) {
                    document.getElementById('name').value = data.name || '';
                    items = (data.items || []).map(i => ({
                        herbId: i.herbId,
                        doseG: i.doseG
                    }));
                    console.log('Items mapped:', items);
                    renderItems();
                }
            } catch (err) {
                console.error('Failed to load prescription:', err);
                showToast('无法加载药方详情', 'error');
            }
        }

        function addItem() {
            items.push({ herbId: null, doseG: '' });
            renderItems();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }

        function updateItem(index, key, value) {
            items[index][key] = value;
        }

        function renderItems() {
            const listEl = document.getElementById('itemList');
            const emptyEl = document.getElementById('emptyState');

            if (items.length === 0) {
                emptyEl.style.display = 'block';
                listEl.innerHTML = '';
                return;
            }

            emptyEl.style.display = 'none';
            listEl.innerHTML = items.map((item, index) => `
                <div class="item-row">
                    <select class="form-select" onchange="updateItem(${index}, 'herbId', this.value)">
                        <option value="">选择药材</option>
                        ${herbs.map(h => `
                            <option value="${h.id}" ${h.id == item.herbId ? 'selected' : ''}>${h.nameCn}</option>
                        `).join('')}
                    </select>
                    <input type="number" class="form-input" style="width: 80px;" placeholder="克重" value="${item.doseG}" oninput="updateItem(${index}, 'doseG', this.value)" />
                    <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">×</button>
                </div>
            `).join('');
        }

        async function savePrescription() {
            const name = document.getElementById('name').value.trim();

            if (!name) {
                showToast('请输入药方名称', 'error');
                return;
            }

            if (items.length === 0) {
                showToast('请至少添加一味药材', 'error');
                return;
            }

            // Validate
            const cleanItems = items.map(item => ({
                herbId: parseInt(item.herbId),
                doseG: parseFloat(item.doseG)
            }));

            for (const item of cleanItems) {
                if (!item.herbId) {
                    showToast('请选择所有行的药材', 'error');
                    return;
                }
                if (!item.doseG || item.doseG <= 0) {
                    showToast('克重必须大于0', 'error');
                    return;
                }
            }

            const payload = { name, items: cleanItems };

            try {
                if (id) {
                    await api.updatePrescription(id, payload);
                } else {
                    await api.createPrescription(payload);
                }
                showToast('保存成功');
                setTimeout(() => window.location.href = 'prescription.html', 1000);
            } catch (err) {
                // Handled
            }
        }
    </script>
</body>

</html>
