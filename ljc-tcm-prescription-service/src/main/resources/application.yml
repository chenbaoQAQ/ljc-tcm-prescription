server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: tcm-prescription-service
  data:
    jpa:
      repositories:
        enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
